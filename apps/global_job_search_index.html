<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Job Search Widget</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4efe5;
    color: #17211d;
    padding: 20px;
  }
  #widget {
    background: white;
    padding: 20px;
    border-radius: 7px;
    max-width: 900px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  h2 { margin-top: 0; }
  .search-box { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .search-box button {padding:10px 18px;cursor:pointer;border:0;border-radius:7px;background:#245b4b;color:white}
  .portal {border-radius:7px}
  @media(max-width:650px){.search-box{flex-direction:column}}
  .search-box input, .search-box select {
    padding: 10px;
    font-size: 16px;
    flex: 1;
  }
  .portal {
    padding: 10px;
    background: #fafafa;
    border-radius: 6px;
    margin-bottom: 10px;
    border-left: 4px solid #0077cc;
  }
  .portal a {
    font-size: 17px;
    font-weight: bold;
    color: #0077cc;
    text-decoration: none;
  }
  .portal small {
    display: block;
    margin-top: 5px;
    color: #555;
  }
</style>
</head>
<body>

<div id="widget">
    <h2>Global Job Search Directory</h2>

    <!-- Search + Region Filter -->
    <div class="search-box">
        <input type="text" id="zipSearch" placeholder="Search job sites by name, specialty, or region" aria-label="Search job directories">
        <select id="regionFilter">
            <option value="All">All Regions</option>
            <option value="Global">Global</option>
            <option value="US">United States</option>
            <option value="Europe">Europe</option>
            <option value="Asia">Asia</option>
            <option value="Africa">Africa</option>
            <option value="Australia">Australia / Oceania</option>
        </select>
        <button id="searchPortals" type="button">Search</button>
    </div>

    <section aria-labelledby="vacancyTitle" style="border-top:1px solid #c9bda8;padding-top:18px;margin-top:18px">
      <h2 id="vacancyTitle">Geographic Vacancy Search</h2>
      <p>Search verified imported job records by location, postal code, job title, and work arrangement. Listings are not live until an authorized vacancy dataset is supplied.</p>
      <div class="search-box">
        <input id="vacancyKeyword" aria-label="Job title or keyword" placeholder="Job title or keyword">
        <input id="vacancyLocation" aria-label="City, state, country, or postal code" placeholder="City, state, country, or ZIP / postal code">
        <select id="vacancyWork" aria-label="Work arrangement"><option value="">All arrangements</option><option value="onsite">On-site</option><option value="hybrid">Hybrid</option><option value="remote">Remote</option></select>
      </div>
      <div class="search-box">
        <select id="vacancyFreshness" aria-label="Posted within"><option value="">Any posting date</option><option value="7">Past 7 days</option><option value="30">Past 30 days</option><option value="90">Past 90 days</option></select>
        <select id="vacancySort" aria-label="Sort vacancies"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Job title A–Z</option><option value="company">Employer A–Z</option></select>
      </div>
      <div class="search-box">
        <button type="button" id="vacancySearch">Search vacancies</button>
        <button type="button" id="vacancyClear">Clear filters</button>
        <button type="button" id="vacancyExport">Export matching CSV</button>
        <label style="flex:1">Import authorized vacancies (JSON) <input id="vacancyImport" type="file" accept=".json,application/json"></label>
      </div>
      <p id="vacancyStatus" role="status" aria-live="polite"></p>
      <p id="vacancyDatasetInfo" class="small"></p>
      <div id="vacancyResults"></div>
    </section>
    <!-- Results -->
    <p id="resultCount" aria-live="polite"></p>
    <div id="portalList"></div>
</div>

<script>
/* -----------------------------
   FULL JOB PORTALS JSON LIST
   (Expandable anytime)
--------------------------------*/
const jobPortals = [
  {
    "name": "Indeed",
    "url": "https://www.indeed.com",
    "regions_served": ["Global", "60+ countries"],
    "niche": "General"
  },
  {
    "name": "LinkedIn Jobs",
    "url": "https://www.linkedin.com/jobs",
    "regions_served": ["Global"],
    "niche": "Professional / General"
  },
  {
    "name": "Glassdoor",
    "url": "https://www.glassdoor.com",
    "regions_served": ["Global"],
    "niche": "General / Salaries / Company Reviews"
  },
  {
    "name": "Monster",
    "url": "https://www.monster.com",
    "regions_served": ["Global"],
    "niche": "General"
  },
  {
    "name": "Adzuna",
    "url": "https://www.adzuna.com",
    "regions_served": ["Global", "UK", "Europe"],
    "niche": "General / Aggregator"
  },
  {
    "name": "WhatJobs",
    "url": "https://www.whatjobs.com",
    "regions_served": ["Global"],
    "niche": "General"
  },
  {
    "name": "Dice",
    "url": "https://www.dice.com",
    "regions_served": ["US"],
    "niche": "Tech / Engineering"
  },
  {
    "name": "Kalibrr",
    "url": "https://www.kalibrr.com",
    "regions_served": ["Asia", "Global (remote)"],
    "niche": "General / Asia / Remote"
  },
  {
    "name": "HiringCafe",
    "url": "https://hiring.cafe",
    "regions_served": ["Global"],
    "niche": "Direct employer job aggregation"
  },
  {
    "name": "We Work Remotely",
    "url": "https://weworkremotely.com",
    "regions_served": ["Global"],
    "niche": "Remote"
  },
  {
    "name": "RemoteOK",
    "url": "https://remoteok.com",
    "regions_served": ["Global"],
    "niche": "Remote"
  },
  {
    "name": "FlexJobs",
    "url": "https://www.flexjobs.com",
    "regions_served": ["Global"],
    "niche": "Remote / Flexible"
  },
  {
    "name": "Upwork",
    "url": "https://www.upwork.com",
    "regions_served": ["Global"],
    "niche": "Freelance"
  },
  {
    "name": "Toptal",
    "url": "https://www.toptal.com",
    "regions_served": ["Global"],
    "niche": "Elite freelance talent"
  },
  {
    "name": "XING Jobs",
    "url": "https://www.xing.com/jobs",
    "regions_served": ["Europe"],
    "niche": "Professional / European"
  }
  // <-- Continue adding your expanded list here
];

/* -----------------------------
   RENDERING FUNCTION
--------------------------------*/
function renderPortals() {
    const region = document.getElementById('regionFilter').value;
    const query = document.getElementById('zipSearch').value.trim().toLowerCase();
    const list = document.getElementById('portalList');
    list.replaceChildren();
    let shown = 0;
    jobPortals.forEach(portal => {
        const regions = portal.regions_served;
        const matchesRegion = region === 'All' || regions.some(r => r === region || r.startsWith(region+' ') || r === 'Global');
        const haystack = [portal.name, portal.niche, ...regions].join(' ').toLowerCase();
        if (!matchesRegion || (query && !haystack.includes(query))) return;
        const div = document.createElement('div');
        div.className = 'portal';
        const link = document.createElement('a');
        link.href = portal.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = portal.name;
        const regionLine = document.createElement('small');
        regionLine.textContent = 'Regions: ' + regions.join(', ');
        const nicheLine = document.createElement('small');
        nicheLine.textContent = 'Specialty: ' + portal.niche;
        div.append(link, regionLine, nicheLine);
        list.appendChild(div);
        shown++;
    });
    document.getElementById('resultCount').textContent = shown + ' job directories found. Search filters directory descriptions, not live job vacancies.';
}
document.getElementById('searchPortals').addEventListener('click', renderPortals);
document.getElementById('zipSearch').addEventListener('input', renderPortals);
document.getElementById('regionFilter').addEventListener('change', renderPortals);
// Geographic vacancy records are supplied by an authorized JSON export.
// Schema: {jobs:[{id,title,company,city,state,country,postal_code,work_arrangement,apply_url,posted_at,source}]}
let vacancyRecords = [];
let visibleVacancies = [];
let vacancyDatasetDate = null;
const vacancyStatus = document.getElementById('vacancyStatus');
function renderVacancies() {
  const keyword = document.getElementById('vacancyKeyword').value.trim().toLowerCase();
  const location = document.getElementById('vacancyLocation').value.trim().toLowerCase();
  const arrangement = document.getElementById('vacancyWork').value;
  const freshness = Number(document.getElementById('vacancyFreshness').value);
  const sort = document.getElementById('vacancySort').value;
  const results = document.getElementById('vacancyResults');
  results.replaceChildren();
  const now = Date.now();
  const matches = vacancyRecords.filter(job => {
    const text = [job.title,job.company].join(' ').toLowerCase();
    const geography = [job.city,job.state,job.country,job.postal_code].join(' ').toLowerCase();
    return (!keyword || text.includes(keyword)) &&
      (!location || geography.includes(location) || (job.work_arrangement==='remote' && location==='remote')) &&
      (!arrangement || job.work_arrangement===arrangement) &&
      (!freshness || (Number.isFinite(Date.parse(job.posted_at)) && Date.parse(job.posted_at) <= now && now-Date.parse(job.posted_at) <= freshness*86400000));
  });
  matches.sort((a,b) => {
    if(sort==='title') return a.title.localeCompare(b.title);
    if(sort==='company') return a.company.localeCompare(b.company);
    const av=Date.parse(a.posted_at), bv=Date.parse(b.posted_at);
    return sort==='oldest' ? av-bv : bv-av;
  });
  visibleVacancies = matches;
  vacancyStatus.textContent = vacancyRecords.length ?
    matches.length+' matching vacancies from '+vacancyRecords.length+' imported records. Confirm availability with the employer.' :
    'No published vacancy records available. You may import an authorized JSON dataset locally.';
  matches.slice(0,100).forEach(job => {
    const card = document.createElement('article');
    card.className = 'portal';
    const heading = document.createElement('h3');
    heading.textContent = job.title+' — '+job.company;
    const detail = document.createElement('p');
    detail.textContent = [job.city,job.state,job.country,job.postal_code,job.work_arrangement].filter(Boolean).join(' · ');
    const meta = document.createElement('small');
    meta.textContent = 'Source: '+job.source+' · Listing date: '+job.posted_at;
    const link = document.createElement('a');
    link.href = job.apply_url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'View original vacancy / Apply';
    card.append(heading,detail,meta,link);
    results.appendChild(card);
  });
  if(matches.length>100) {
    const note=document.createElement('p');
    note.textContent='Showing first 100 results. Refine your search.';
    results.appendChild(note);
  }
}
function validVacancy(job) {
  if (!job || typeof job!=='object') return false;
  const fields=['id','title','company','city','state','country','postal_code','work_arrangement','apply_url','posted_at','source'];
  if (!fields.every(k => typeof job[k]==='string' && job[k].length<=500)) return false;
  if (!job.id || !job.title || !job.company || !job.source || !job.apply_url) return false;
  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(job.posted_at) || !Number.isFinite(Date.parse(job.posted_at))) return false;
  if (!['onsite','hybrid','remote'].includes(job.work_arrangement)) return false;
  try { return new URL(job.apply_url).protocol==='https:'; } catch { return false; }
}
document.getElementById('vacancyImport').addEventListener('change', async event => {
  const file=event.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){vacancyStatus.textContent='File exceeds 5 MB limit.';return;}
  try {
    const data=JSON.parse(await file.text());
    if(!data || !Array.isArray(data.jobs) || data.jobs.length>10000 || !data.jobs.every(validVacancy)) throw new Error('Invalid schema');
    const seen = new Set();
    vacancyDatasetDate = null;
    vacancyRecords=data.jobs.filter(job => {
      const key=(job.id+'|'+job.source+'|'+job.apply_url).toLowerCase();
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    document.getElementById('vacancyDatasetInfo').textContent='Local file imported; not automatically refreshed.';
    renderVacancies();
  } catch {
    vacancyStatus.textContent='Import rejected. Use a valid authorized JSON vacancy export with required fields.';
  }
});
['vacancyKeyword','vacancyLocation'].forEach(id => document.getElementById(id).addEventListener('input',renderVacancies));
document.getElementById('vacancyWork').addEventListener('change',renderVacancies);
['vacancyFreshness','vacancySort'].forEach(id=>document.getElementById(id).addEventListener('change',renderVacancies));
document.getElementById('vacancyClear').addEventListener('click',()=>{
  ['vacancyKeyword','vacancyLocation','vacancyWork','vacancyFreshness'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('vacancySort').value='newest';
  renderVacancies();
});
document.getElementById('vacancyExport').addEventListener('click',()=>{
  if(!visibleVacancies.length){vacancyStatus.textContent='No matching vacancies to export.';return;}
  const keys=['title','company','city','state','country','postal_code','work_arrangement','posted_at','source','apply_url'];
  const escapeCSV=value=>'"'+String(value??'').replace(/"/g,'""').replace(/^[=+@-]/,m=>"'"+m)+'"';
  const csv=[keys,...visibleVacancies.map(job=>keys.map(k=>job[k]))].map(row=>row.map(escapeCSV).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='vacancy-search-results.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.getElementById('vacancySearch').addEventListener('click',renderVacancies);
renderVacancies();
async function loadPublishedVacancies() {
  try {
    const response=await fetch('../data/vacancies.json',{cache:'no-store'});
    if(!response.ok) throw new Error('Dataset unavailable');
    const data=await response.json();
    if(!data || !Array.isArray(data.jobs) || data.jobs.length>10000 || !data.jobs.every(validVacancy)) throw new Error('Dataset invalid');
    vacancyRecords=data.jobs;
    vacancyDatasetDate=typeof data.generated_at==='string' ? data.generated_at : null;
    document.getElementById('vacancyDatasetInfo').textContent=vacancyDatasetDate ?
      'Published vacancy dataset last refreshed: '+vacancyDatasetDate+'. Check availability at employer site.' :
      'No published feed refresh has been completed yet.';
    renderVacancies();
  } catch {
    document.getElementById('vacancyDatasetInfo').textContent='Published dataset unavailable; directory links remain accessible.';
    renderVacancies();
  }
}
loadPublishedVacancies();
// Initial Render
renderPortals();
</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
