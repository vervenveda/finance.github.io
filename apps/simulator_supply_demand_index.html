<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply & Demand Simulator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
    background:#f8f9fa;
}

h1{
    text-align:center;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

canvas{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.results{
    margin-top:20px;
    display:flex;
    gap:20px;
}

.result{
    flex:1;
    text-align:center;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.value{
    font-size:2rem;
    color:#0066cc;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Interactive Supply & Demand Simulator</h1>

<div class="controls">

    <div class="card">
        <label>
            Demand Strength:
            <span id="demandValue">50</span>
        </label>
        <input id="demand" type="range" min="10" max="90" value="50">
    </div>

    <div class="card">
        <label>
            Supply Strength:
            <span id="supplyValue">50</span>
        </label>
        <input id="supply" type="range" min="10" max="90" value="50">
    </div>

</div>

<canvas id="graph" width="850" height="500"></canvas>

<div class="results">
    <div class="result">
        <div>Equilibrium Price</div>
        <div class="value" id="price">50</div>
    </div>

    <div class="result">
        <div>Equilibrium Quantity</div>
        <div class="value" id="quantity">50</div>
    </div>
</div>

<script>

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const demandSlider = document.getElementById("demand");
const supplySlider = document.getElementById("supply");

function draw(){

    const demandShift = Number(demandSlider.value);
    const supplyShift = Number(supplySlider.value);

    document.getElementById("demandValue").textContent = demandShift;
    document.getElementById("supplyValue").textContent = supplyShift;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const margin = 60;
    const w = canvas.width - margin * 2;
    const h = canvas.height - margin * 2;

    // Axes
    ctx.beginPath();
    ctx.moveTo(margin, margin);
    ctx.lineTo(margin, margin + h);
    ctx.lineTo(margin + w, margin + h);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#333";
    ctx.fillText("Price", 20, 40);
    ctx.fillText("Quantity", canvas.width - 70, canvas.height - 20);

    // Demand line
    const dY1 = margin + h - demandShift * 3;
    const dY2 = margin + demandShift;

    ctx.beginPath();
    ctx.moveTo(margin, dY1);
    ctx.lineTo(margin + w, dY2);
    ctx.strokeStyle = "#d62828";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Supply line
    const sY1 = margin + h - supplyShift;
    const sY2 = margin + supplyShift * 3;

    ctx.beginPath();
    ctx.moveTo(margin, sY1);
    ctx.lineTo(margin + w, sY2);
    ctx.strokeStyle = "#2a9d8f";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Find line intersection
    const x1 = margin;
    const x2 = margin + w;

    const mDemand = (dY2 - dY1) / (x2 - x1);
    const bDemand = dY1 - mDemand * x1;

    const mSupply = (sY2 - sY1) / (x2 - x1);
    const bSupply = sY1 - mSupply * x1;

    const xEq = (bSupply - bDemand) / (mDemand - mSupply);
    const yEq = mDemand * xEq + bDemand;

    // Draw equilibrium point
    ctx.beginPath();
    ctx.arc(xEq, yEq, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#000";
    ctx.fill();

    ctx.setLineDash([5,5]);

    ctx.beginPath();
    ctx.moveTo(xEq, yEq);
    ctx.lineTo(xEq, margin + h);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(margin, yEq);
    ctx.lineTo(xEq, yEq);
    ctx.stroke();

    ctx.setLineDash([]);

    // Calculate displayed values
    const quantity =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(((xEq - margin) / w) * 100)
            )
        );

    const price =
        Math.max(
            0,
            Math.min(
                100,
                Math.round((1 - ((yEq - margin) / h)) * 100)
            )
        );

    document.getElementById("price").textContent = price;
    document.getElementById("quantity").textContent = quantity;

    // Labels
    ctx.fillStyle = "#d62828";
    ctx.fillText("Demand", margin + 20, dY1 - 10);

    ctx.fillStyle = "#2a9d8f";
    ctx.fillText("Supply", margin + 20, sY1 + 20);

    ctx.fillStyle = "#000";
    ctx.fillText("Equilibrium", xEq + 10, yEq - 10);
}

demandSlider.addEventListener("input", draw);
supplySlider.addEventListener("input", draw);

draw();

</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
