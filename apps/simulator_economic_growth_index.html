<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Long-Run Economic Growth Simulator</title> <style> body{ font-family:system-ui,sans-serif; max-width:1100px; margin:40px auto; padding:20px; background:#f5f7fa; } h1{ text-align:center; } .subtitle{ text-align:center; color:#555; margin-bottom:30px; } .controls{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; } .card{ background:white; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); } label{ display:block; font-weight:600; margin-bottom:8px; } input[type=range]{ width:100%; } canvas{ width:100%; background:white; border-radius:12px; margin-top:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); } .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin-top:20px; } .stat{ background:white; text-align:center; padding:15px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); } .value{ font-size:2rem; color:#1565c0; font-weight:bold; } </style> </head> <body> <h1>Long-Run Growth Simulator</h1> <p class="subtitle"> Explore how savings, depreciation, population growth, and innovation influence long-run prosperity. </p> <div class="controls"> <div class="card"> <label>Savings / Investment Rate: <span id="sVal">25</span>%</label> <input id="savings" type="range" min="5" max="60" value="25"> </div> <div class="card"> <label>Depreciation Rate: <span id="dVal">5</span>%</label> <input id="depreciation" type="range" min="1" max="15" value="5"> </div> <div class="card"> <label>Population Growth: <span id="nVal">1</span>%</label> <input id="population" type="range" min="0" max="5" value="1"> </div> <div class="card"> <label>Technology Growth: <span id="gVal">2</span>%</label> <input id="technology" type="range" min="0" max="8" value="2"> </div> </div> <canvas id="chart" width="1000" height="500"></canvas> <div class="stats"> <div class="stat"> <div>Steady-State Capital</div> <div id="capitalOut" class="value">0</div> </div> <div class="stat"> <div>Output per Worker</div> <div id="outputOut" class="value">0</div> </div> <div class="stat"> <div>Growth Potential</div> <div id="growthOut" class="value">0%</div> </div> </div> <script> const canvas = document.getElementById("chart"); const ctx = canvas.getContext("2d"); const savings = document.getElementById("savings"); const depreciation = document.getElementById("depreciation"); const population = document.getElementById("population"); const technology = document.getElementById("technology"); function production(k){ return Math.pow(k,0.5); } function update(){ const s = Number(savings.value)/100; const d = Number(depreciation.value)/100; const n = Number(population.value)/100; const g = Number(technology.value)/100; document.getElementById("sVal").textContent=savings.value; document.getElementById("dVal").textContent=depreciation.value; document.getElementById("nVal").textContent=population.value; document.getElementById("gVal").textContent=technology.value; ctx.clearRect(0,0,canvas.width,canvas.height); const margin=60; const w=canvas.width-margin*2; const h=canvas.height-margin*2; ctx.beginPath(); ctx.moveTo(margin,margin); ctx.lineTo(margin,margin+h); ctx.lineTo(margin+w,margin+h); ctx.strokeStyle="#333"; ctx.lineWidth=2; ctx.stroke(); ctx.fillText("Capital per Worker", canvas.width-140, canvas.height-20); ctx.save(); ctx.translate(20,120); ctx.rotate(-Math.PI/2); ctx.fillText("Investment / Break-even Needs",0,0); ctx.restore(); const maxK=100; let steadyK=0; let smallestGap=Infinity; ctx.beginPath(); for(let k=0;k<=maxK;k++){ const invest=s*production(k); const x=margin+(k/maxK)*w; const y=margin+h-(invest*55); if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); const breakEven=(d+n+g)*k; const gap=Math.abs(invest-breakEven); if(gap<smallestGap){ smallestGap=gap; steadyK=k; } } ctx.strokeStyle="#2e7d32"; ctx.lineWidth=3; ctx.stroke(); ctx.beginPath(); for(let k=0;k<=maxK;k++){ const breakEven=(d+n+g)*k; const x=margin+(k/maxK)*w; const y=margin+h-(breakEven*40); if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.strokeStyle="#d32f2f"; ctx.lineWidth=3; ctx.stroke(); const investSS=s*production(steadyK); const xEq=margin+(steadyK/maxK)*w; const yEq=margin+h-(investSS*55); ctx.beginPath(); ctx.arc(xEq,yEq,7,0,Math.PI*2); ctx.fillStyle="#000"; ctx.fill(); ctx.fillText("Steady State",xEq+10,yEq-10); const output=production(steadyK); const growthPotential=(g*100).toFixed(1); document.getElementById("capitalOut").textContent= steadyK.toFixed(0); document.getElementById("outputOut").textContent= output.toFixed(1); document.getElementById("growthOut").textContent= growthPotential+"%"; ctx.fillStyle="#2e7d32"; ctx.fillText("Investment", margin+20, margin+25); ctx.fillStyle="#d32f2f"; ctx.fillText("Depreciation + Population + Technology Needs", margin+150, margin+25 ); } [savings,depreciation,population,technology] .forEach(el=>el.addEventListener("input",update)); update(); </script>

</body> </html>
